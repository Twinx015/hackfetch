[project]
name = "hackfetch"
version = "0.1.0"
description = "A fastfetch inspired tool to shows your hackatime stats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=13.0"]

[project.scripts]
hackfetch = "src.main:main"
hkf = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
